{% load static %}
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title|default:"STU Online Examination" }}</title>
    <link rel="icon" type="image/png" href="{% static 'images/stu_exam_logo_dark_mode.png' %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS Files -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/home.css' %}" />
    <link rel="stylesheet" href="{% static 'css/exam.css' %}" />
    <link rel="stylesheet" href="{% static 'css/footer.css' %}" />
    <link rel="stylesheet" href="{% static 'css/sidebar-hamster.css' %}" />
    <link rel="stylesheet" href="{% static 'css/liquid-glass.css' %}" />
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <!-- Bộ lọc kính liquid dùng chung -->
    {% include "includes/liquid-filter.html" %}

    <!-- Thanh điều hướng phía trên -->
    {% include "includes/navbar.html" %}

    <div class="wrapper">
      <!-- Thanh menu dọc bên trái -->
      {% include "includes/sidebar.html" %}

      <!-- Nội dung chính thay đổi theo từng trang -->
      <div class="content">{% block body_block %} {% endblock %}</div>
    </div>

    <!-- Chân trang -->
    {% include "includes/footer.html" %}

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{% static 'js/app.js' %}"></script>
  </body>
</html>
